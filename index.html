<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sovereign — trading jurnal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #edeff2;
        --card: #ffffff;
        --card2: #f5f6f8;
        --glass: rgba(255, 255, 255, 0.78);
        --line: rgba(16, 24, 40, 0.09);
        --line2: rgba(16, 24, 40, 0.18);
        --tx: #0e131b;
        --tx2: #4a5566;
        --tx3: #7a8494;
        --gain: #047857;
        --loss: #be123c;
        --gold: #8a6a12;
        --be: #7a8494;
        --gainsoft: rgba(4, 120, 87, 0.11);
        --losssoft: rgba(190, 18, 60, 0.09);
        --goldsoft: rgba(138, 106, 18, 0.11);
        --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        --sans:
          "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --r: 10px;
        --rl: 16px;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0a0d12;
          --card: #121824;
          --card2: #171f2e;
          --glass: rgba(18, 24, 36, 0.74);
          --line: rgba(255, 255, 255, 0.07);
          --line2: rgba(255, 255, 255, 0.15);
          --tx: #e9ecf1;
          --tx2: #9aa4b5;
          --tx3: #667085;
          --gain: #10b981;
          --loss: #f43f5e;
          --gold: #d4af37;
          --be: #667085;
          --gainsoft: rgba(16, 185, 129, 0.13);
          --losssoft: rgba(244, 63, 94, 0.13);
          --goldsoft: rgba(212, 175, 55, 0.12);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0a0d12;
        --card: #121824;
        --card2: #171f2e;
        --glass: rgba(18, 24, 36, 0.74);
        --line: rgba(255, 255, 255, 0.07);
        --line2: rgba(255, 255, 255, 0.15);
        --tx: #e9ecf1;
        --tx2: #9aa4b5;
        --tx3: #667085;
        --gain: #10b981;
        --loss: #f43f5e;
        --gold: #d4af37;
        --be: #667085;
        --gainsoft: rgba(16, 185, 129, 0.13);
        --losssoft: rgba(244, 63, 94, 0.13);
        --goldsoft: rgba(212, 175, 55, 0.12);
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 30;
        background: var(--glass);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      img {
        max-width: 100%;
      }
      .app {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
        min-height: 100vh;
      }
      .side {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        height: calc(100vh - env(safe-area-inset-top, 0px));
        border-right: 1px solid var(--line);
        padding: 22px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 2px 10px 22px;
      }
      .brand .mk {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--gold);
        display: grid;
        place-items: center;
        color: var(--gold);
      }
      .brand b {
        font-family: var(--serif);
        font-size: 23px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .brand small {
        display: block;
        color: var(--tx3);
        font-size: 11px;
        margin-top: -4px;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 12px;
        border-radius: var(--r);
        border: 0;
        background: none;
        color: var(--tx2);
        text-align: left;
        width: 100%;
        font-weight: 500;
        position: relative;
      }
      .nav:hover {
        background: var(--card2);
        color: var(--tx);
      }
      .nav.on {
        background: var(--card);
        color: var(--tx);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .nav.on::before {
        content: "";
        position: absolute;
        left: -14px;
        top: 9px;
        bottom: 9px;
        width: 2px;
        background: var(--gold);
      }
      .nav svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .side .foot {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: var(--glass);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 28px;
        flex-wrap: wrap;
      }
      .top h1 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 26px;
        margin: 0;
        letter-spacing: 0.01em;
        flex: 1;
        min-width: 140px;
      }
      .view {
        padding: 24px 28px 48px;
        max-width: 1320px;
        width: 100%;
      }
      .enter {
        animation: enter 0.26s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .enter {
          animation: none;
        }
        .pulse {
          animation: none !important;
        }
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--rl);
        padding: 18px 20px;
        min-width: 0;
      }
      .card h3 {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
        color: var(--tx2);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card h3 .sp {
        flex: 1;
      }
      .grid {
        display: grid;
        gap: 14px;
      }
      .g2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .g4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .g32 {
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      }
      .kpi .l {
        font-size: 12px;
        color: var(--tx3);
      }
      .kpi .v {
        font-size: 21px;
        font-weight: 600;
        margin-top: 2px;
        letter-spacing: -0.01em;
      }
      .kpi .s {
        font-size: 12px;
        color: var(--tx3);
        margin-top: 2px;
      }
      .up {
        color: var(--gain);
      }
      .dn {
        color: var(--loss);
      }
      .mut {
        color: var(--tx3);
      }
      .gold {
        color: var(--gold);
      }
      .hero {
        display: flex;
        flex-wrap: wrap;
        gap: 20px 40px;
        align-items: flex-end;
        padding: 22px 24px;
        border-radius: var(--rl);
        border: 1px solid var(--line);
        background: var(--card);
        margin-bottom: 14px;
        position: relative;
        overflow: hidden;
      }
      .hero::after {
        content: "";
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--gold);
      }
      .hero .big {
        font-family: var(--serif);
        font-size: 52px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .hero .lbl {
        font-size: 12px;
        color: var(--tx3);
        margin-bottom: 6px;
      }
      .hero .sub {
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
      }
      .hero .sub div b {
        display: block;
        font-size: 16px;
        font-weight: 600;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 999px;
        border: 1px solid var(--line2);
        color: var(--tx2);
        white-space: nowrap;
        background: none;
      }
      .chip.g {
        border-color: transparent;
        background: var(--gainsoft);
        color: var(--gain);
      }
      .chip.r {
        border-color: transparent;
        background: var(--losssoft);
        color: var(--loss);
      }
      .chip.au {
        border-color: transparent;
        background: var(--goldsoft);
        color: var(--gold);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 14px;
        border-radius: var(--r);
        border: 1px solid var(--line2);
        background: var(--card);
        font-weight: 500;
        font-size: 13px;
      }
      .btn:hover {
        border-color: var(--tx3);
      }
      .btn.pri {
        background: var(--gold);
        color: #0a0d12;
        border-color: var(--gold);
      }
      .btn.pri:hover {
        filter: brightness(1.06);
      }
      .btn.sm {
        padding: 5px 10px;
        font-size: 12px;
      }
      .btn.ghost {
        border-color: transparent;
        background: none;
      }
      .btn svg {
        width: 15px;
        height: 15px;
      }
      select,
      input[type="text"],
      input[type="number"],
      input[type="date"],
      input[type="password"],
      textarea {
        background: var(--card2);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 8px 10px;
        width: 100%;
        min-width: 0;
      }
      textarea {
        min-height: 96px;
        resize: vertical;
        line-height: 1.55;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--gold);
      }
      label.f {
        display: block;
        font-size: 12px;
        color: var(--tx3);
        margin-bottom: 4px;
      }
      .tw {
        overflow-x: auto;
        margin: 0 -4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        font-weight: 500;
        color: var(--tx3);
        text-align: left;
        padding: 7px 8px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        font-size: 12px;
      }
      td {
        padding: 9px 8px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.r,
      th.r {
        text-align: right;
      }
      .side-l {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        padding: 1px 7px;
        border-radius: 5px;
      }
      .side-l.b {
        background: var(--gainsoft);
        color: var(--gain);
      }
      .side-l.s {
        background: var(--losssoft);
        color: var(--loss);
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 5px;
        background: var(--card2);
        color: var(--tx2);
        margin: 1px 3px 1px 0;
        border: 1px solid var(--line);
      }
      .tag.x {
        background: var(--losssoft);
        color: var(--loss);
        border-color: transparent;
      }
      .chartbox {
        height: 280px;
        position: relative;
      }
      .empty {
        padding: 28px 10px;
        text-align: center;
        color: var(--tx3);
        font-size: 13px;
      }
      .bars .row {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr) 30px;
        gap: 10px;
        align-items: center;
        font-size: 12px;
        margin: 6px 0;
      }
      .bars .tr {
        height: 6px;
        border-radius: 3px;
        background: var(--card2);
        overflow: hidden;
      }
      .bars .tr i {
        display: block;
        height: 100%;
        background: var(--loss);
      }
      /* calendar */
      .calhead {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .calhead h2 {
        font-family: var(--serif);
        font-size: 28px;
        font-weight: 600;
        margin: 0 8px 0 0;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(0, 1.15fr);
        gap: 6px;
      }
      .cal .wd {
        font-size: 11px;
        color: var(--tx3);
        padding: 0 4px 2px;
      }
      .cell {
        min-height: 84px;
        border-radius: var(--r);
        border: 1px solid var(--line);
        background: var(--card);
        padding: 7px 8px;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 2px;
        transition: border-color 0.15s;
      }
      .cell:hover {
        border-color: var(--line2);
      }
      .cell .d {
        font-size: 12px;
        color: var(--tx3);
      }
      .cell .p {
        font-weight: 600;
        font-size: 14px;
        margin-top: auto;
      }
      .cell .n {
        font-size: 11px;
        color: var(--tx3);
      }
      .cell.out {
        opacity: 0.35;
      }
      .cell.win {
        background: var(--gainsoft);
        border-color: transparent;
      }
      .cell.win .p {
        color: var(--gain);
      }
      .cell.loss {
        background: var(--losssoft);
        border-color: transparent;
      }
      .cell.loss .p {
        color: var(--loss);
      }
      .cell.flat .p {
        color: var(--be);
      }
      .cell.sel {
        box-shadow: 0 0 0 2px var(--gold);
      }
      .cell.jr::after {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--gold);
        position: relative;
        align-self: flex-end;
        margin-top: -10px;
      }
      .wk {
        border-radius: var(--r);
        border: 1px dashed var(--line2);
        padding: 7px 9px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        font-size: 11px;
        color: var(--tx3);
      }
      .wk b {
        font-size: 14px;
      }
      .daypanel {
        margin-top: 14px;
      }
      /* journal */
      .score {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .score button {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card2);
        font-weight: 600;
        font-size: 13px;
      }
      .score button.on {
        background: var(--gold);
        border-color: var(--gold);
        color: #0a0d12;
      }
      .rules label {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        cursor: pointer;
      }
      .rules label:last-child {
        border-bottom: 0;
      }
      .rules input {
        accent-color: var(--gold);
        margin-top: 3px;
        width: 16px;
        height: 16px;
        flex: none;
      }
      .tagpick {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tagpick button {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line2);
        background: none;
        color: var(--tx2);
      }
      .tagpick button.on {
        background: var(--goldsoft);
        color: var(--gold);
        border-color: transparent;
      }
      .tagpick button.on.x {
        background: var(--losssoft);
        color: var(--loss);
      }
      .shots {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .shot {
        border: 1px dashed var(--line2);
        border-radius: var(--r);
        min-height: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--tx3);
        font-size: 12px;
        position: relative;
        overflow: hidden;
        background: var(--card2);
      }
      .shot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        inset: 0;
      }
      .shot .rm {
        position: absolute;
        top: 6px;
        right: 6px;
        z-index: 2;
      }
      .shot input {
        display: none;
      }
      .fgrid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .saved {
        font-size: 12px;
        color: var(--tx3);
      }
      /* charts */
      .pills {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .pill {
        padding: 7px 12px;
        border-radius: 999px;
        border: 1px solid var(--line2);
        background: var(--card);
        font-size: 13px;
        font-weight: 500;
        color: var(--tx2);
      }
      .pill.on {
        border-color: var(--gold);
        color: var(--tx);
        box-shadow: inset 0 0 0 1px var(--gold);
      }
      .pill small {
        color: var(--tx3);
        font-weight: 400;
        margin-left: 5px;
      }
      .bigchart {
        height: 460px;
      }
      .lv {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .lv b {
        font-family: var(--serif);
        font-size: 34px;
        font-weight: 600;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--tx2);
        margin-top: 10px;
      }
      .legend i {
        display: inline-block;
        width: 14px;
        height: 2px;
        vertical-align: middle;
        margin-right: 6px;
      }
      .trow {
        cursor: pointer;
      }
      .trow:hover td {
        background: var(--card2);
      }
      .trow.on td {
        background: var(--goldsoft);
      }
      /* news */
      .countdown {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        padding: 18px 22px;
        border-radius: var(--rl);
        border: 1px solid var(--line);
        background: var(--card);
        margin-bottom: 14px;
      }
      .countdown .t {
        font-family: var(--serif);
        font-size: 40px;
        font-weight: 600;
        line-height: 1;
      }
      .countdown.alert {
        border-color: var(--loss);
        background: var(--losssoft);
      }
      .pulse {
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .imp {
        display: inline-flex;
        gap: 2px;
      }
      .imp i {
        width: 5px;
        height: 12px;
        border-radius: 1px;
        background: var(--line2);
      }
      .imp.h i {
        background: var(--loss);
      }
      .imp.m i:nth-child(-n + 2) {
        background: var(--gold);
      }
      .imp.l i:first-child {
        background: var(--tx3);
      }
      .daysep td {
        background: var(--card2);
        font-weight: 600;
        font-size: 12px;
        color: var(--tx2);
      }
      .past td {
        color: var(--tx3);
      }
      .past td.act {
        color: var(--tx);
      }
      /* academy */
      .lvl {
        margin-bottom: 22px;
      }
      .lvl h2 {
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 2px;
      }
      .lvl p.d {
        margin: 0 0 12px;
        color: var(--tx3);
        font-size: 13px;
      }
      .arts {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 12px;
      }
      .art {
        text-align: left;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: var(--rl);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 128px;
      }
      .art:hover {

        /* ---------- market model (mock) ---------- */
        const SYMS = {

          if (SERIES[sym]) return SERIES[sym];
          const c = SYMS[sym];
          const r = rngF(
            sym.split("").reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7),

          const bars = [],
            idx = new Map();
          let p = c.p0 * (0.985 + r() * 0.03),
            drift = 0;

            const o = p;
            const ch = gauss(r) * c.vol * sess + drift + rev;
            const cl = o * Math.exp(ch);
            const hi =
              Math.max(o, cl) * (1 + Math.abs(gauss(r)) * c.vol * 0.45 * sess);
            const lo =
              Math.min(o, cl) * (1 - Math.abs(gauss(r)) * c.vol * 0.45 * sess);
            const b = { time: t / 1000, open: o, high: hi, low: lo, close: cl };
            idx.set(t, bars.length);
            bars.push(b);
            p = cl;
          }
          SERIES[sym] = { bars, idx };
          return SERIES[sym];
        }

          const k = Math.floor(t / H) * H;

                if (r() < 0.5) tags.push(MIST[Math.floor(r() * MIST.length)]);
                if (m.wr < 0.5 && r() < 0.18) {

                  tags = ["SL siljitildi"];
                }
              }
              const exit = entry + dir * R * sld;
              const tp = entry + dir * (2 + Math.round(r()) * 0.5) * sld;
              const sl = entry - dir * sld;
              const hold = m.scalp ? 3 + r() * 40 : 12 + r() * 300;
              const ct = ot + hold * 60000;
              const pnl =
                Math.round(lots * c.cv * (exit - entry) * dir * 100) / 100;
              out.push({
                id: acc.id + "-" + out.length,
                acc: acc.id,
                sym,
                dir,
                lots,
                entry,
                exit,
                sl,
                tp,
                ot,
                ct,
                pnl,
                R: Math.round((pnl / riskUsd) * 100) / 100,
                setup,
                tags,
                src: "mt",
              });
            }
          }

              ) / 100,
            );
            res.push({
              id: acc.id + "-o" + id,
              acc: acc.id,
              sym,
              dir,
              lots,
              entry,
              sl: entry - dir * sld,
              tp: entry + dir * 2 * sld,
              ot: Date.UTC(2026, 9, 16, 13, 20) - id * 7 * H,
              price: lp,
              pnl: Math.round(lots * c.cv * (lp - entry) * dir * 100) / 100,
              open: true,

        function readImage(file) {
          return new Promise((res, rej) => {
            const fr = new FileReader();
            fr.onload = () => {
              const img = new Image();
              img.onload = () => {
                const sc = Math.min(1, 1100 / img.width);
                const cv = document.createElement("canvas");
                cv.width = Math.round(img.width * sc);
                cv.height = Math.round(img.height * sc);
                cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
                res(cv);
              };
              img.onerror = rej;
              img.src = fr.result;
            };
            fr.onerror = rej;
            fr.readAsDataURL(file);
          });
        }

              const blob = await new Promise((r) =>
                cv.toBlob(r, "image/jpeg", 0.85),
              );
              const up = await Store.assets.upload(blob);
              url = up.url;
            } else url = cv.toDataURL("image/jpeg", 0.62);
            jSet((e) => {
              e.shots = e.shots || {};

            render();

            toast("Rasmni yuklab bo‘lmadi");

                ((ed.link.mode || "investor") === "investor" ? "on" : "") +
                '">Investor parol</button><button data-lmode="api" class="' +
                (ed.link.mode === "api" ? "on" : "") +
                '">API / Webhook</button></div>' +
                ((ed.link.mode || "investor") === "investor"
                  ? '<div class="fgrid" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
                    ain(
                      "l_server",
                      "Server",
                      ed.link.server || "",
                      "text",
                      "Exness-MT5Real8",
                    ) +
                    ain("l_login", "Login", ed.number, "text", "") +
                    '<div style="grid-column:1/-1"><label class="f">Investor (faqat o‘qish) paroli</label><input type="password" id="l_pass" autocomplete="off" placeholder="Investor parol"></div></div>'
                  : '<div><label class="f">Webhook manzili (EA yoki bridge shu yerga yuboradi)</label><input type="text" readonly value="https://api.sovereign.example/hook/' +
                    esc(ed.id) +
                    '"></div>') +
                '<p class="mut" style="font-size:12px;margin:10px 0">Prototip: ulanish simulyatsiya qilinadi, parol saqlanmaydi va hech qayerga yuborilmaydi. Haqiqiy sinxronizatsiya uchun server tomoni (masalan, MetaApi kabi bridge) kerak.</p>' +
                '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="link">' +
                ic("link") +
                (ed.link.on ? "Qayta ulash" : "Ulash") +
                "</button>" +
                (ed.link.on
                  ? '<button class="btn" data-act="unlink">Uzish</button>'
                  : "") +
                '</div><div class="steps" id="steps" style="margin-top:10px"></div></div>';
            }
          }
          modal(h);
        }
        function ain(k, l, v, t, ph) {
          return (
            '<div><label class="f" for="a_' +
            k +
            '">' +
            l +
            '</label><input type="' +
            t +
            '" id="a_' +
            k +
            '" value="' +
            esc(v) +
            '" placeholder="' +
            esc(ph) +
            '"></div>'
          );
        }
        function saveAcc() {
          const g = (k) => {
            const e = $("#a_" + k);
            return e ? e.value.trim() : "";
          };
          const name = g("name"),
            cap = Number(g("capital"));
          if (!name || !(cap > 0)) {
            $("#aerr").textContent = "Nom va kapitalni kiriting.";
            return;
          }
          const body = {
            name,
            broker: g("broker"),
            number: g("number"),
            capital: cap,
            currency: g("currency"),
            leverage: g("leverage"),
            platform: g("platform"),
          };
          if (editId === "new") {
            if (S.accounts.length >= 3) return;
            const a = Object.assign(
              { id: "acc-" + uid(), link: { on: false } },
              body,
            );
            S.accounts.push(a);
            S.sel = a.id;
          } else Object.assign(accById(editId), body);
          Store.save("accounts");
          editId = null;
          openAccounts();
          render();
          toast("Hisob saqlandi");
        }
        function simLink() {
          const a = accById(editId);
          const st = $("#steps");
          const srv = $("#a_l_server");
          const steps = [
            "Serverga ulanmoqda…",
            "Read-only kirish tekshirilmoqda…",
            "Balans va equity olinmoqda…",
            "Savdolar tarixi yuklanmoqda…",
          ];
          let i = 0;
          st.innerHTML = "";
          const nx = () => {
            if (i > 0) st.children[i - 1].className = "ok";
            if (i >= steps.length) {
              a.link = {
                on: true,
                mode: a.link.mode || "investor",
                server: srv ? srv.value : a.link.server,
                last: Date.now(),
              };
              Store.save("accounts");
              toast("Hisob ulandi");
              setTimeout(() => {
                openAccounts();
                render();
              }, 500);
              return;
            }
            const d = document.createElement("div");
            d.textContent = steps[i];
            st.appendChild(d);
            i++;
            setTimeout(nx, 550);
          };
          nx();
        }

        /* ---------- events ---------- */
        document.addEventListener("click", (e) => {
          const t = e.target.closest(
            "button,[data-day],[data-chart],[data-pick],[data-scrim]",
          );
          if (!t) return;
          const ds = t.dataset;
          if (ds.scrim !== undefined && e.target === t) {
            closeModal();
            editId = null;
            return;
          }
          if (ds.close !== undefined) {
            closeModal();
            editId = null;
            return;
          }
          if (ds.go) {
            S.view = ds.go;
            window.scrollTo({ top: 0 });
            render();
            return;
          }
          if (ds.day) {
            S.calSel = S.calSel === ds.day ? null : ds.day;
            document
              .querySelectorAll(".cell")
              .forEach((c) =>
                c.classList.toggle("sel", c.dataset.day === S.calSel),
              );
            if (S.calSel) dayPanel();
            else $("#daypanel").innerHTML = "";
            return;
          }
          if (ds.cal) {
            S.calM += Number(ds.cal);
            if (S.calM < 0) {
              S.calM = 11;
              S.calY--;
            }
            if (S.calM > 11) {
              S.calM = 0;
              S.calY++;
            }
            S.calSel = null;
            render();
            return;
          }
          if (ds.openj) {
            S.jDate = ds.openj;
            S.view = "jour";
            S.form = null;
            render();
            return;
          }
          if (ds.chart) {
            const [sym, id] = ds.chart.split("|");
            S.chartSym = sym;
            S.chartTrade = id;
            S.view = "chart";
            window.scrollTo({ top: 0 });
            render();
            return;
          }
          if (ds.pick) {
            S.chartTrade = ds.pick;
            render();
            return;
          }
          if (ds.sym) {
            S.chartSym = ds.sym;
            S.chartTrade = null;
            render();
            return;
          }
          if (ds.jd) {
            const d = parseYmd(S.jDate);
            d.setDate(d.getDate() + Number(ds.jd));
            S.jDate = ymd(d);
            render();
            return;
          }
          if (ds.score) {
            jSet((x) => (x.mental = Number(ds.score)));
            document
              .querySelectorAll("#score button")
              .forEach((b) => b.classList.toggle("on", b === t));
            return;
          }
          if (ds.setup) {
            S.form.setup = S.form.setup === ds.setup ? "" : ds.setup;
            document
              .querySelectorAll("[data-setup]")
              .forEach((b) =>
                b.classList.toggle("on", b.dataset.setup === S.form.setup),
              );
            return;
          }
          if (ds.ftag) {
            const a = S.form.tags,
              i = a.indexOf(ds.ftag);
            if (i >= 0) a.splice(i, 1);
            else a.push(ds.ftag);
            t.className = a.includes(ds.ftag)
              ? "on" + (MIST.includes(ds.ftag) ? " x" : "")
              : "";
            return;
          }
          if (ds.del) {
            S.manual = S.manual.filter((m) => m.id !== ds.del);
            Store.save("manual");
            render();
            toast("Savdo o‘chirildi");
            return;
          }
          if (ds.rmshot) {
            e.preventDefault();
            jSet((x) => {
              if (x.shots) delete x.shots[ds.rmshot];
            });
            render();
            return;
          }
          if (ds.imp) {
            S.nImp[ds.imp] = !S.nImp[ds.imp];
            render();
            return;
          }
          if (ds.ncur) {
            S.nCur[ds.ncur] = !S.nCur[ds.ncur];
            render();
            return;
          }
          if (ds.art) {
            openArt(ds.art);
            return;
          }
          if (ds.bt) {
            const C = chal();
            C.bt = Math.max(0, C.bt + Number(ds.bt));
            Store.save("meta");
            render();
            return;
          }
          if (ds.exp) {
            exportCsv(ds.exp);
            return;
          }
          if (ds.markread) {
            if (!S.meta.read.includes(ds.markread)) {
              S.meta.read.push(ds.markread);
              Store.save("meta");
            }
            openArt(ds.markread);
            if (S.view === "acad") render();
            return;
          }
          if (ds.edit) {
            editId = ds.edit;
            openAccounts();
            return;
          }
          if (ds.lmode) {
            const a = accById(editId);
            a.link = Object.assign({}, a.link, { mode: ds.lmode });
            openAccounts();
            return;
          }
          const act = ds.act;
          if (!act) return;
          if (act === "accounts") {
            editId = null;
            openAccounts();
          } else if (act === "theme") {
            const cur =
              document.documentElement.getAttribute("data-theme") ||
              (matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light");
            const nx = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", nx);
            try {
              localStorage.setItem(LS + "-theme", nx);
            } catch (e) {}
            render();
          } else if (act === "sync") {
            const a = accById(S.sel);
            if (!a.link || !a.link.on) {
              editId = a.id;
              openAccounts();
              return;
            }
            t.disabled = true;
            t.querySelector("svg").style.animation =
              "spin 0.9s linear infinite";
            setTimeout(() => {
              a.link.last = Date.now();
              Store.save("accounts");
              renderTop();
              toast("Balans, pozitsiyalar va tarix yangilandi");
            }, 1200);
          } else if (act === "addtrade") addTrade();
          else if (act === "saveacc") saveAcc();
          else if (act === "cancelacc") {
            editId = null;
            openAccounts();
          } else if (act === "delacc") {
            S.accounts = S.accounts.filter((a) => a.id !== editId);
            S.manual = S.manual.filter((m) => m.acc !== editId);
            if (!accById(S.sel)) S.sel = S.accounts[0].id;
            Store.save("accounts");
            Store.save("manual");
            editId = null;
            openAccounts();
            render();
          } else if (act === "link") simLink();
          else if (act === "fresh") {
            S.meta.mockOff = true;
            Store.save("meta");
            render();
            toast("Namuna savdolar yashirildi");
          } else if (act === "togglemock") {
            S.meta.mockOff = !S.meta.mockOff;
            Store.save("meta");
            openAccounts();
            render();
          } else if (act === "wipe") {
            if (!wipeArm) {
              wipeArm = true;
              openAccounts();
              setTimeout(() => {
                wipeArm = false;
              }, 6000);
              return;
            }
            wipeArm = false;
            const old = Object.keys(S.journal);
            S.manual = [];
            S.journal = {};
            S.meta.mockOff = true;
            Store.save("manual");
            Store.save("meta");
            old.forEach((k) => Store.save("journal", k));
            openAccounts();
            render();
            toast("Jurnal va savdolar tozalandi");
          } else if (act === "unlink") {
            accById(editId).link = { on: false };
            Store.save("accounts");
            openAccounts();
            render();
          }
        });
        document.addEventListener("change", (e) => {
          const t = e.target;
          if (t.id === "accsel") {
            S.sel = t.value;
            S.chartTrade = null;
            render();
            return;
          }
          if (t.id === "jdate" && t.value) {
            S.jDate = t.value;
            render();
            return;
          }
          if (t.id === "bias") {
            jSet((x) => (x.bias = t.value));
            return;
          }
          if (t.dataset.rule != null) {
            jSet((x) => {
              x.rules = x.rules || {};
              x.rules[t.dataset.rule] = t.checked;
            });
            const n = Object.values(S.journal[S.jDate].rules).filter(
              Boolean,
            ).length;
            const c = t.closest(".card").querySelector(".chip");
            if (c) c.textContent = n + "/" + RULES.length;
            return;
          }
          if (t.dataset.shot) {
            onShot(t.dataset.shot, t.files[0]);
            return;
          }
          if (t.id === "chstart" && t.value) {
            chal().start = t.value;
            Store.save("meta");
            render();
            return;
          }
          if (t.dataset.chd) {
            const C = chal(),
              i = Number(t.dataset.chd);
            C.done = C.done.filter((x) => x !== i);
            if (t.checked) C.done.push(i);
            Store.save("meta");
            render();
            return;
          }
          if (t.dataset.lc === "sym") {
            S.lc = {
              sym: t.value,
              bal: S.lc.bal,
              risk: S.lc.risk,
              entry: "",
              sl: "",
            };
            render();
            return;
          }
          if (t.dataset.f === "sym" || t.dataset.f === "dir") {
            S.form[t.dataset.f] = t.value;
          }
        });
        document.addEventListener("input", (e) => {
          const t = e.target;
          if (t.dataset.lc && t.dataset.lc !== "sym") {
            S.lc[t.dataset.lc] = t.value;
            const o = $("#lcout");
            if (o) o.innerHTML = lotCalcOut();
            return;
          }
          if (t.dataset.f) {
            S.form[t.dataset.f] = t.value;
            const er = $("#ferr");
            if (er) er.textContent = "";
            return;
          }
          if (t.id === "biasNote") {
            jSet((x) => (x.biasNote = t.value));
            return;
          }
          if (t.id === "post") {
            jSet((x) => (x.post = t.value));
            return;
          }
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && $("#modal").innerHTML) {
            closeModal();
            editId = null;
          }
        });
        const sp = document.createElement("style");
        sp.textContent = "@keyframes spin{to{transform:rotate(360deg)}}";
        document.head.appendChild(sp);
        matchMedia("(prefers-color-scheme: dark)").addEventListener(
          "change",
          () => {
            if (!document.documentElement.getAttribute("data-theme")) render();
          },
        );

        render();
        Store.connect();
      })();
    </script>
  </body>
</html>
